_base: "./exp-simple-code-base.yaml"
_name: "per-task-claude-opus46-local-iter5-c10"
_description: "Claude Opus 4.6 isolated per-task evolution on local terminal-bench path; 5 iterations, up to 10 concurrent tasks"
_tags: ["claude", "opus41", "per-task-evolution", "verifier-visible", "local-path", "iter5", "c10"]

path: "./datasets/terminal-bench-2-1/tasks"

max_iterations: 5
target_pass_rate: 1.0

harbor:
  k: 1
  n_concurrent: 10

per_task_evolution:
  enabled: true
  hide_test_results_from_evolver: true
  n_concurrent_tasks: 10
  n_concurrent_rollouts: 1

best_of_n:
  enabled: false

notify:
  enabled: false

# Official Anthropic docs checked on 2026-05-28 list Claude Opus 4.1
# (`claude-opus-4-1-20250805`) and Claude Opus 4
# (`claude-opus-4-20250514`), but not an official `Opus 4.6` API model ID.
# If you are using a proxy/gateway that exposes a custom `4.6` alias, replace
# the model strings below with that provider-specific alias.
llm:
  api_key: "${CLAUDE_API_KEY}"
  base_url: "https://api.anthropic.com"
  model: "claude-opus-4-6"

agent_debugger:
  llm:
    api_key: "${CLAUDE_API_KEY}"
    base_url: "https://api.anthropic.com"
    model: "claude-opus-4-6"
    api_type: anthropic_chat_completion
    max_tokens: 128000
    thinking:
      type: adaptive
    output_config:
      effort: "high"

code_agent_patch:
  tool_call_mode: anthropic
  llm_config:
    api_type: anthropic_chat_completion
    max_tokens: 128000
    reasoning: null
    thinking:
      type: adaptive
    output_config:
      effort: "high"

evolve_agent:
  tool_call_mode: anthropic
  llm_config:
    api_key: "${CLAUDE_API_KEY}"
    base_url: "https://api.anthropic.com"
    model: "claude-opus-4-6"
    api_type: anthropic_chat_completion
    max_tokens: 128000
    reasoning: null
    thinking:
      type: adaptive
    output_config:
      effort: "high"

explore_agent_patch:
  tool_call_mode: anthropic
  llm_config:
    api_type: anthropic_chat_completion
    max_tokens: 128000
    reasoning: null
    thinking:
      type: adaptive
    output_config:
      effort: "high"

explore_agent:
  enabled: false
  model: "claude-opus-4-6"
