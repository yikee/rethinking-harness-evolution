[project]
name = "rethinking-harness-evolution"
version = "0.1.0"
description = "Rethinking Harness Evolution"
readme = "README.md"
requires-python = ">=3.13"
license = { text = "MIT" }
authors = [
    { name = "Curry09" },
]
dependencies = [
    "pyyaml>=6.0",
    "python-dotenv>=1.0",
    "e2b>=1.0.0",
    "nexau @ git+https://github.com/nex-agi/NexAU.git@v0.3.9",
    "harbor @ git+https://github.com/Curry09/harbor-LJH.git",
    "agent_debugger_core",
]

[project.scripts]
harness-scaling = "evolve:main"
harness-evolution = "evolve_ahe:main"

[tool.uv]
constraint-dependencies = ["claude-agent-sdk<0.1.49"]

[tool.uv.sources]
agent_debugger_core = { path = "agents/evolve_agent/skills/agent-debugger-cli/_source" }

[tool.setuptools]
py-modules = ["evolve", "evolve_ahe"]

[tool.setuptools.packages.find]
include = ["agents*"]
